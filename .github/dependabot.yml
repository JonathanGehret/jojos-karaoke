# Dependabot: security fixes only.
# open-pull-requests-limit: 0 turns off routine version-update PRs; security-fix PRs
# still open when an advisory hits, grouped into one PR per ecosystem per run.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "uv"
    directories:
      - "/maker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
